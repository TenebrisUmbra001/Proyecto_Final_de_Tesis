<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa de Conectividad de Pinar del Rio</title>
  <link rel="stylesheet" href="/private/Styles/mapa.css" />
</head>
<body>
  <header>
    <h1>Mapa De Conectividad RIM Pinar Del Rio</h1>
    <button id="btnAdmin" class="AdminPanel" title="Panel de Administracion" style="display:none;">
      ⚙ Panel Administracion
    </button>
    <button id="btnSalir" class="SalirPanel">Salir</button>
  </header>

  <main>
    <section class="Mapa">
      <img class="municipio" id="img-sandino"      data-id="sandino"      data-nombre="Sandino"             draggable="false" src="/private/assets/SandinoNew.png"     alt="Sandino" />
      <img class="municipio" id="img-mantua"       data-id="mantua"       data-nombre="Mantua"              draggable="false" src="/private/assets/mantuaNEW.png"      alt="Mantua" />
      <img class="municipio" id="img-minas"        data-id="minas"        data-nombre="Minas de Matahambre" draggable="false" src="/private/assets/minas_NEW.png"       alt="Minas" />
      <img class="municipio" id="img-vinales"      data-id="vinales"      data-nombre="Viñales"             draggable="false" src="/private/assets/vinalesNEW.png"      alt="Viñales" />
      <img class="municipio" id="img-palma"        data-id="palma"        data-nombre="La Palma"            draggable="false" src="/private/assets/palmaNEW.png"        alt="La Palma" />
      <img class="municipio" id="img-guane"        data-id="guane"        data-nombre="Guane"               draggable="false" src="/private/assets/guaneNEW.png"        alt="Guane" />
      <img class="municipio" id="img-sanluis"      data-id="sanluis"      data-nombre="San Luis"            draggable="false" src="/private/assets/sanluisNEW.png"      alt="San Luis" />
      <img class="municipio" id="img-sanjuan"      data-id="sanjuan"      data-nombre="San Juan y Martínez" draggable="false" src="/private/assets/sanjuanNEW.png"      alt="San Juan" />
      <img class="municipio" id="img-pinar"        data-id="pinar"        data-nombre="Pinar del Río"       draggable="false" src="/private/assets/pinarNEW.png"        alt="Pinar" />
      <img class="municipio" id="img-consolacion"  data-id="consolacion"  data-nombre="Consolación del Sur" draggable="false" src="/private/assets/consolacion_NEW.png" alt="Consolación" />
      <img class="municipio" id="img-los-palacios" data-id="los-palacios" data-nombre="Los Palacios"        draggable="false" src="/private/assets/palacios_NEW.png"    alt="Los Palacios" />
    </section>

    <section class="Informacion">
      <h2 class="h2">INFORMACION</h2>
      <p id="listad">Seleccione un municipio</p>
      <div id="detalle"></div>
    </section>
  </main>

  <footer>
    <p>Todos los derechos reservados ICC CCR Pinar del Rio MININT<br />2026</p>
  </footer>

  <script src="/private/Javascripts/mapa.js"></script>
</body>
</html>
